<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    body {
      background: #f5f6fa;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .nav1 {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #6c63ff;
      padding: 15px 30px;
      color: white;
      box-sizing: border-box;
    }
    .button1 {
      background-color: #fff;
      color: #6c63ff;
      padding: 8px 16px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 20px;
    }
    .button1:hover {
      background-color: #6c63ff;
      color: #fff;
    }
    .nav1 .logo{
      font-size: 28px;
      font-weight: bold;
    }
        #taskitems {
  margin-top: 20px;
  margin-left: auto;
  margin-right: auto;
  width: 90%;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 12px;
}
@media (max-width: 600px) {
  #taskitems {
    grid-template-columns: 1fr; /* single column for small screens */
  }
}

   
    .taskcard {
      background: #fff;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
      position: relative;
    }
    .taskcard h3 {
      margin: 0 0 5px;
      color: #6c63ff;
    }
    .taskcard p {
      margin: 5px 0;
    }
    .taskcard button {
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 5px;
      font-size: 14px;
    }
    .editBtn { background-color: #ffc107; color: #fff; }
    .deleteBtn { background-color: #dc3545; color: #fff; }
  </style>
</head>
<body>

  <header>
    <nav class="nav1">
      <div class="logo">Task Manager</div>
      <button class="button1" onclick="window.location.href='taskform.html'">+</button>
    </nav>
  </header>

  <div id="taskitems"></div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

    function displayTasks() {
      const taskList = document.getElementById("taskitems");
      taskList.innerHTML = "";
      tasks.forEach((task, index) => {
        let taskDiv = document.createElement("div");
        taskDiv.classList.add("taskcard");
        taskDiv.innerHTML = `
          <h3>${task.name}</h3>
          <p>${task.desc}</p>
          <small>Due: ${task.date}</small><br><br>
          <button class="editBtn" onclick="editTask(${index})">Edit</button>
          <button class="deleteBtn" onclick="deleteTask(${index})">Delete</button>
        `;
        taskList.appendChild(taskDiv);
      });
    }

    function deleteTask(index) {
      if(confirm("Are you sure you want to delete this task?")) {
        tasks.splice(index, 1);
        localStorage.setItem("tasks", JSON.stringify(tasks));
        displayTasks();
      }
    }

    function editTask(index) {
      const task = tasks[index];
      localStorage.setItem("editIndex", index);
      localStorage.setItem("editTask", JSON.stringify(task));
      window.location.href = "taskform.html";
    }

    displayTasks();
  </script>

</body>
</html>
